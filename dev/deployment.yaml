apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auto-frontend
  template:
    metadata:
      labels:
        app: auto-frontend
    spec:
      containers:
        - name: auto-frontend
          image: bhanureddy1906/auto-frontend:31578756cfde26cfcda2398041ccabcd0c107892
          ports:
            - containerPort: 80
