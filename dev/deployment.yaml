apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auto-frontend
  template:
    metadata:
      labels:
        app: auto-frontend
    spec:
      containers:
        - name: auto-frontend
          image: bhanureddy1906/auto-frontend:efbbf0d337c37a4a76e41790a31f14c3486219a4
          ports:
            - containerPort: 80
